# Render Blueprint (D18): one free web service in Virginia, next to Neon (AWS us-east-1). No disk: all state is in
# Postgres. Secret values are never in this file: `sync: false` variables are entered in the Render dashboard when
# the Blueprint is first created, and `generateValue` variables are random values Render creates itself.
services:
  - type: web
    # The service keeps its original name so the public URL stays https://device-repair-agent.onrender.com.
    name: device-repair-agent
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: virginia
    # Deploy a commit only after its CI run (lint, typecheck, tests, build, gitleaks) has passed.
    autoDeployTrigger: checksPass
    # The image's CMD starts the server; migrations run before it accepts traffic, so a deploy whose database is
    # unreachable never passes the health check.
    # Render probes this every few seconds for as long as the service runs, so it must not touch the database:
    # /readyz would keep Neon's compute awake around the clock and exhaust the free compute budget (D09).
    healthCheckPath: /healthz
    # Shutdown: on SIGTERM the server stops within 10 s (app/boot/shutdown.py). Render's documented default
    # grace period is 30 s (docs: render.com/docs/deploys, checked 2026-11-10), so it is not set here:
    # `maxShutdownDelaySeconds` exists, but the docs don't say whether free services may change it.
    envVars:
      - key: NODE_ENV
        value: production
      # The service's public URL, e.g. https://device-repair-agent.onrender.com (scheme and host only).
      - key: PUBLIC_ORIGIN
        sync: false
      # Render's proxy appends the client's address to X-Forwarded-For. Check after deploying: the remoteAddress of
      # requests in the logs must be your own public IP. If every request shows the same proxy address, raise this.
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: DATABASE_URL
        sync: false
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: FILE_URL_SECRET
        generateValue: true
      - key: HOOK_SECRET
        generateValue: true
      - key: ALLOW_TEST_API
        value: "false"
      # Optional (P10-T03): lets the owner lift the free-tier quota guard for 24 h with
      # `curl -X POST -H "Authorization: Bearer <token>" $PUBLIC_ORIGIN/api/quota/override`. Leave empty to disable it.
      - key: QUOTA_OVERRIDE_TOKEN
        sync: false
